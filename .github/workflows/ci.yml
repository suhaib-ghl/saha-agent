name: Core tests and clean install
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q saha_agent scripts tests
      - run: node --check saha_agent/web/app.js
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel and run demo from outside the checkout
        run: |
          python -m venv /tmp/saha-install-test
          /tmp/saha-install-test/bin/python -m pip install dist/*.whl
          python scripts/install_smoke.py /tmp/saha-install-test/bin/python
      - run: python scripts/package.py --output /tmp/saha-source.zip
